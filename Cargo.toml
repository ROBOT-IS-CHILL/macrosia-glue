[package]
name = "macrosia-glue"
version = "0.1.8"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "macrosia_glue"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.26", features = ["attributes", "async-std-runtime"] }
async-std = "1.13"
macrosia = {git = "https://github.com/ROBOT-IS-CHILL/macrosia.git", version = "0.2.3", features = ["catch-panic"]}
rusqlite = {version = "0.37", features = ["bundled", "functions"] }
itertools = "0.14"

[profile.release]
debug = true
panic = "unwind"
